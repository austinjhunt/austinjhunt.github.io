<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback — Snap n' Sell</title>
<link rel="manifest" href="favicon_io/site.webmanifest">
<link rel="icon" href="favicon_io/favicon.ico" type="image/x-icon"/>
<link rel="shortcut icon" href="favicon_io/favicon.ico" type="image/x-icon"/>

<meta name="description" content="Share your feedback about Snap n' Sell on the App Store.">
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #0a84ff;
    --accent-2: #5e5ce6;
    --border: #e5e5ea;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 24px;
  }
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0;
  }
  nav .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 18px;
    color: var(--text);
    text-decoration: none;
  }
  .logo {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 16px;
  }
  .logo img {
    max-width: 100%;
  }
  nav .links a {
    color: var(--muted);
    text-decoration: none;
    margin-left: 20px;
    font-size: 15px;
  }
  nav .links a:hover { color: var(--text); }

  /* Page content */
  .feedback-hero {
    text-align: center;
    padding: 80px 0 96px;
    max-width: 560px;
    margin: 0 auto;
  }
  .feedback-hero .hero-icon {
    width: 80px;
    height: 80px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    margin-bottom: 24px;
  }
  .feedback-hero h1 {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1.1;
    margin: 0 0 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .feedback-hero p {
    color: var(--muted);
    font-size: 18px;
    line-height: 1.5;
    margin: 0 0 36px;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--text);
    color: var(--bg);
    padding: 16px 32px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 17px;
    text-decoration: none;
    transition: transform 0.15s ease;
  }
  .cta:hover { transform: scale(1.03); }

  footer {
    border-top: 1px solid var(--border);
    padding: 32px 0;
    margin-top: 64px;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
  }
  footer a {
    color: var(--muted);
    text-decoration: none;
    margin: 0 12px;
  }
  footer a:hover { color: var(--text); }

  @media (max-width: 640px) {
    .feedback-hero { padding: 48px 0 64px; }
    .feedback-hero h1 { font-size: 32px; }
    .feedback-hero p { font-size: 16px; }
    nav .links a { margin-left: 12px; font-size: 14px; }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #98989d;
      --border: #2c2c2e;
    }
    .cta {
      background: var(--text);
      color: #000;
    }
  }
</style>
</head>
<body>

<div class="wrap">

  <nav>
    <a href="index.html" class="brand">
      <span class="logo"><img src="snapnsell-icon-light.png" title="snap n sell app icon"/></span>
      <span>Snap n' Sell</span>
    </a>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="privacy-policy.html">Privacy</a>
      <a href="terms-of-service.html">Terms</a>
      <a href="feedback.html">Feedback</a>
    </div>
  </nav>

  <section class="feedback-hero">
    <div class="hero-icon">⭐</div>
    <h1>We'd love your feedback</h1>
    <p>Your reviews help us improve Snap n' Sell and help other sellers discover the app. It only takes a moment.</p>
    <a href="https://apps.apple.com/app/id6780761209?action=write-review" target="_blank" rel="noopener" class="cta">Leave a Review on the App Store →</a>
  </section>

  <footer>
    &copy; 2026 Austin Hunt
    <div style="margin-top: 8px;">
      <a href="privacy-policy.html">Privacy</a> ·
      <a href="terms-of-service.html">Terms</a> ·
      <a href="feedback.html">Feedback</a> ·
      <a href="mailto:austincodescleanly@gmail.com">Contact</a>
    </div>
  </footer>

</div>

</body>
</html>
